---
apiVersion: v1
kind: Pod 
metadata:
  name: postgress-db-pod
  labels:
    name: postgress-db-pod 
    app: voting-app
spec:
  containers:
    - name: postgres
      image: postgres:9.4
      env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
      ports:
        - containerPort: 5432